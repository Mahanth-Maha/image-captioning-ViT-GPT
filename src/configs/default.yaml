batch_size: 32
gradient_accumulation: 4
tokenizer: bpe
model:
  name: 'vit-gpt-debug'
  encoder:
    vocab_size: 196
    dim: 64
    context_length: 196
    ffn_dim: 256
    n_heads: 4
    Nx: 6
    patch_size: 16  # 224/16 = 14x14 = 196 patches
    img_resize: 224
  
  decoder:
    vocab_size: 16384
    dim: 64
    context_length: 32
    ffn_dim: 256
    n_heads: 4
    Nx: 6

  n_kv_heads: null
  dropout: 0.1
  tie_weights: true
  init_std: 0.2
  use_checkpoint: true
  checkpoint_ratio: 0.5

training:
  accum_steps: null
  max_grad_norm: 1.0

  learning_rate: 1e-3
  weight_decay: 0.01
  max_steps: 10000
  epochs: 3
  use_epochs: true
  gradient_clip: 1.0
  avg_overfit_time: null
  
  scheduler: 'cosine'
  warmup_steps: 1000
  
  min_lr_ratio: 0.1
  optimizer: 'adamw'
  betas: [0.9, 0.95]
  eps: 1e-8
  
  val_every_steps: 5000
  val_max_batches: 100

  save_every_steps: 1000
  log_every_steps: 100
  moving_avg_alpha: 0.025

  async_ckpt_write: true
  keep_last: 3

  milestone_every: 1000

  use_tensorboard: true
  use_wandb: false
  wandb_mode: offline

  max_caption_length: 35
  generation_temperature: 0.9
  generation_top_k: 50
  generation_top_p: 0.9
  num_eval_samples: 5

  grad_skip_nan_inf: true
  bf16_autocast: true
  use_amp: true
  amp_dtype: 'bfloat16'

  run_name: null
  log_dir: checkpoints/vit

  train_time_warmup: 0
  precomputed_train_time: 162.302

device: cuda